name: security
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check ${{ matrix.checks }}
          arguments: --workspace --all-features
          rust-version: "1.88"
  osv-pr:
    if: github.event_name == 'pull_request'
    # The reusable workflow's job asks `security-events: write` (its own file, job `osv-scan`),
    # and a caller that grants less fails at startup on every event, pushes included, because
    # GitHub validates the nested permissions before it reads the `if`. Map 130, 2026-10-15.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --lockfile=Cargo.lock
      upload-sarif: false
      fail-on-vuln: true
