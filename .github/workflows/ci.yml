name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  check:
    # macOS because the pty, the process-start-time liveness test and the gate dialects are
    # measured there. The corpus walks read HYDRA_ROOT, which here is an empty scratch root.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The runner context is not readable from a job-level env block, so the root is set here.
      - run: |
          echo "HYDRA_ROOT=$RUNNER_TEMP/hydra-ci" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hydra-ci/runs"
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build --release
      - run: cargo test --release --no-fail-fast -- --test-threads=1
      # Build ticket 84. The walks above pass on zero records here, so the count goes on the
      # job summary where a reader of a green run sees it.
      - name: corpus count
        run: |
          cargo test --release --test record_contract every_record_on_this_machine_meets_the_contract -- --nocapture 2>&1 \
            | { grep '^checked ' || echo "the corpus walk found no runs directory"; } \
            | tee -a "$GITHUB_STEP_SUMMARY"
