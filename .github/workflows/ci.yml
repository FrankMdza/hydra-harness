name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  check:
    # macOS because the pty, the process-start-time liveness test and the gate dialects are
    # measured there. HYDRA_ROOT points at an empty scratch root so no test reads a real
    # corpus; the fixture walks read tests/fixtures/records (build tickets 101 and 126).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The runner context is not readable from a job-level env block, so the root is set here.
      - run: |
          echo "HYDRA_ROOT=$RUNNER_TEMP/hydra-ci" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hydra-ci/runs"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The workspace, so `hydra-puppets` lands beside `hydra`, where the cockpit looks for it.
      - run: cargo build --release --workspace
      # Build tickets 196 and 220. The workspace, so the unit tests of `hydra-puppets` and
      # `hydra-grader` run here too, and their differential tests. Those compare the Rust with
      # what the Python printed under CPython 3.14 before each ticket deleted it, recorded in
      # `crates/puppets/tests/fixtures/` and `crates/grader/tests/fixtures/`. No test starts
      # `python3`, so no Python is pinned. `crates/puppets/tests/grader_labels.rs` runs the
      # `hydra-puppets` cargo builds for it, and the launchd template's test is
      # `crates/grader/tests/launchd.rs`.
      - run: cargo test --release --workspace --no-fail-fast -- --test-threads=1
      # Build ticket 101. The fixture walks read a synthetic corpus, one directory per provider
      # binary version, so this count is never zero on a green run.
      - name: fixture count
        run: |
          cargo test --release --test record_contract every_fixture_meets_the_contract -- --nocapture 2>&1 \
            | { grep '^checked ' || echo "the fixture walk found no fixtures"; } \
            | tee -a "$GITHUB_STEP_SUMMARY"
