name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  check:
    # macOS because the pty, the process-start-time liveness test and the gate dialects are
    # measured there. The live corpus walks read HYDRA_ROOT, which here is an empty scratch
    # root; the fixture walks beside them read tests/fixtures/records (build ticket 101).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The runner context is not readable from a job-level env block, so the root is set here.
      - run: |
          echo "HYDRA_ROOT=$RUNNER_TEMP/hydra-ci" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hydra-ci/runs"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test --release --no-fail-fast -- --test-threads=1
      # Build ticket 84. The walks above pass on zero records here, so the count goes on the
      # job summary where a reader of a green run sees it.
      - name: corpus count
        run: |
          cargo test --release --test record_contract every_record_on_this_machine_meets_the_contract -- --nocapture 2>&1 \
            | { grep '^checked ' || echo "the corpus walk found no runs directory"; } \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # Build ticket 101. The fixture walks read a synthetic corpus, one directory per provider
      # binary version, so this count is never zero on a green run.
      - name: fixture count
        run: |
          cargo test --release --test record_contract every_fixture_meets_the_contract -- --nocapture 2>&1 \
            | { grep '^checked ' || echo "the fixture walk found no fixtures"; } \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # Build ticket 120. Master of Puppets has no Rust tests; this is its only suite. It runs
      # under the standard library's runner because the macOS image ships no pytest, and the
      # tests are plain unittest cases.
      - run: python3 -m unittest discover -s integrations/puppets/tests -q
