name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  check:
    # macOS because the pty, the process-start-time liveness test and the gate dialects are
    # measured there. HYDRA_ROOT points at an empty scratch root so no test reads a real
    # corpus; the fixture walks read tests/fixtures/records (build tickets 101 and 126).
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)
      # The runner context is not readable from a job-level env block, so the root is set here.
      - run: |
          echo "HYDRA_ROOT=$RUNNER_TEMP/hydra-ci" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hydra-ci/runs"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The workspace, so `hydra-puppets` lands beside `hydra`, where the cockpit looks for it.
      - run: cargo build --release --workspace
      # Build tickets 196 and 220. The workspace, so the unit tests of `hydra-puppets` and
      # `hydra-grader` run here too, and their differential tests. Those compare the Rust with
      # what the Python printed under CPython 3.14 before each ticket deleted it, recorded in
      # `crates/puppets/tests/fixtures/` and `crates/grader/tests/fixtures/`. No test starts
      # `python3`, so no Python is pinned. `crates/puppets/tests/grader_labels.rs` runs the
      # `hydra-puppets` cargo builds for it, and the launchd template's test is
      # `crates/grader/tests/launchd.rs`.
      - run: cargo test --release --workspace --no-fail-fast
      # Build ticket 101. The fixture walks read a synthetic corpus, one directory per provider
      # binary version, so this count is never zero on a green run.
      - name: fixture count
        run: |
          cargo test --release --test record_contract every_fixture_meets_the_contract -- --nocapture 2>&1 \
            | { grep '^checked ' || echo "the fixture walk found no fixtures"; } \
            | tee -a "$GITHUB_STEP_SUMMARY"
  linux:
    # Build ticket 315, from map 119. Linux compiles and is untested at runtime: there is no
    # seatbelt, so `wraps_launches()` is false and recorded runs stay on the Mac. The four
    # `tests/sandbox_*.rs` files are `cfg(target_os = "macos")` and compile to nothing here.
    # `--skip sandbox` on the workspace step drops the `/usr/bin/sandbox-exec` integration
    # tests in `tests/spawn.rs`. The pure unit tests in `src/sandbox.rs` run in their own step
    # below, build ticket 363.
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)
      - run: |
          echo "HYDRA_ROOT=$RUNNER_TEMP/hydra-ci" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hydra-ci/runs"
      - run: cargo build --release --workspace
      # Build ticket 363. The pure unit tests in `src/sandbox.rs`: the bubblewrap
      # composer, the seatbelt rules and the Linux witness. The workspace step below skips
      # them by the `sandbox` substring.
      - run: cargo test --release --lib 'sandbox::tests::'
      # Build 331. `--skip` matches a substring of a test's name across every binary. The
      # nine names after `sandbox` are what a Linux machine has not measured yet (map 130,
      # item 1, groups e, f and g); `README.md` names the same list. Remove a name only with
      # the ticket that makes it pass here.
      #   a_long_frame_survives_being_split_across_reads: a 200,000-byte pty frame arrives cut
      #     on Linux; unmeasured whether the tee or the pty line discipline.
      #   a_grandchild_holding_the_slave_closes_the_record_within_the_deadline: its Linux path
      #     never ran before build 331 (the macOS path returns early). On Linux the orphan
      #     holding the slave dies when the master closes, which the test asserts must not
      #     happen; whether Hydra wants orphans to outlive a run on Linux is undecided.
      #   lgamma_is_cpythons_and_not_the_c_librarys, the_ranking_arithmetic_matches_python,
      #   math_unary_and_sum_match_cpython_hashes,
      #   the_square_the_root_and_log1p_of_a_count_match_cpython_hashes,
      #   the_baseline_trains_reports_and_scores_as_the_python_did,
      #   collect_writes_what_the_python_wrote,
      #   the_monitor_reads_trains_and_scores_as_the_python_did: bit-exact CPython arithmetic
      #     against fixtures recorded on an arm64 Mac; glibc differs in the last bit and the
      #     ranking keeps no tolerance on purpose (build 207).
      - run: >
          cargo test --release --workspace --no-fail-fast --
          --skip sandbox
          --skip a_long_frame_survives_being_split_across_reads
          --skip a_grandchild_holding_the_slave_closes_the_record_within_the_deadline
          --skip lgamma_is_cpythons_and_not_the_c_librarys
          --skip the_ranking_arithmetic_matches_python
          --skip math_unary_and_sum_match_cpython_hashes
          --skip the_square_the_root_and_log1p_of_a_count_match_cpython_hashes
          --skip the_baseline_trains_reports_and_scores_as_the_python_did
          --skip collect_writes_what_the_python_wrote
          --skip the_monitor_reads_trains_and_scores_as_the_python_did
