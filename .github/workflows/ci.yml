name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  check:
    # macOS because the pty, the process-start-time liveness test and the gate dialects are
    # measured there. The corpus walks read HYDRA_ROOT, which here is an empty scratch root.
    runs-on: macos-latest
    env:
      HYDRA_ROOT: ${{ runner.temp }}/hydra-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p "$HYDRA_ROOT/runs"
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build --release
      - run: cargo test --release --no-fail-fast -- --test-threads=1
