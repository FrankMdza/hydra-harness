[package]
name = "hydra-apprentice"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The apprentice: a bank of tasks about run records, the local model's attempts at them, and the preference pairs a panel's grading leaves"
license = "Apache-2.0"
publish = false

[[bin]]
name = "hydra-apprentice"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
hydra-pyjson = { path = "../pyjson" }
hydra-records = { path = "../records" }
sha2 = "0.10"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
