[package]
name = "hydra"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Run coding-agent CLIs in isolated worktrees behind a policy, and record every run"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/FrankMdza/hydra-harness"
keywords = ["agents", "claude-code", "cursor", "harness", "sandbox"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.189"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10"
toml = "1.1.5"
tui-term = "0.3.4"
unicode-width = "0.2.2"
uuid = { version = "1.26.0", features = ["v7"] }
yaml-rust2 = "0.12.0"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
