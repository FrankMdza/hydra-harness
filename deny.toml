[graph]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path with no version, which cargo-deny calls a
# wildcard. Every one of them is `publish = false`, which is the case this switch exists for.
# Found by the first `security` run that got past startup, 2026-10-15 (map 130). The switch
# does not cover `hydra` itself, which is not `publish = false`: its path dependency on
# `hydra-puppets` (build 335) carries a `version` in Cargo.toml for that reason.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
